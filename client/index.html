<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- iOS no usa el manifest para el icono de la pantalla de inicio: usa
         este. Sin el, Safari hace una captura de la pagina y la pone de
         icono. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dos theme-color: el color de la barra del navegador en el movil
         tiene que seguir al modo del sistema, o en oscuro queda una franja
         verde clara encima de una app oscura. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1216" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="MiLepe: red social hiperlocal de Lepe (Huelva)" />
    <title>MiLepe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
