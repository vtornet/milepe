<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- iOS no usa el manifest para el icono de la pantalla de inicio: usa
         este. Sin el, Safari hace una captura de la pagina y la pone de
         icono. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dos theme-color: el color de la barra del navegador en el movil
         tiene que seguir al modo del sistema, o en oscuro queda una franja
         verde clara encima de una app oscura. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1216" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="MiLepe: la red social de Lepe (Huelva). Quejas, eventos, avisos, tablón, farmacias de guardia y mucho más." />
    <title>MiLepe</title>
    <!-- Vista previa al compartir un enlace (WhatsApp, Telegram, Facebook...).
         En /p/:id la edge function netlify/edge-functions/og.js las sustituye
         por las de la publicación: mantener este formato, que es el que busca. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MiLepe" />
    <meta property="og:title" content="MiLepe, la red social de Lepe" />
    <meta property="og:description" content="Quejas, eventos, avisos del Ayuntamiento, tablón, farmacias de guardia y mucho más, contado por los vecinos." />
    <meta property="og:url" content="https://milepe.com" />
    <meta property="og:image" content="https://milepe.com/icons/compartir.png" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
